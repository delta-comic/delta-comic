[package]
name = "tauri-plugin-logger"
description = "Unified, non-blocking tracing logger for Delta Comic and its plugins"
include = ["/src/**", "/test/**", "/permissions/**", "/build.rs", "/Cargo.toml"]
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
links = "tauri-plugin-logger"
keywords = ["tauri", "logging", "tracing", "async"]
categories = ["development-tools::debugging"]

[package.metadata.platforms]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[dependencies]
chrono = { workspace = true }
flate2 = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
tauri = { workspace = true }
taurpc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }