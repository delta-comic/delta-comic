[package]
name = "tauri-plugin-downloader"
description = "High-performance resumable downloader for Delta Comic"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
links = "tauri-plugin-downloader"

[package.metadata.platforms]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[features]
default = ["bittorrent"]
bittorrent = ["dep:librqbit"]

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
httpdate = { workspace = true }
keyring-core = { workspace = true }
librqbit = { workspace = true, optional = true }
md-5 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tauri = { workspace = true }
taurpc = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { workspace = true }
jni = { workspace = true }
ndk-context = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }
windows-sys = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }