version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      pnpm-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      rust-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directories:
      - '/packages/app/src-tauri/gen/android'
      - '/crates/downloader/android'
      - '/crates/utils/android'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      android-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
    groups:
      workflow-actions:
        update-types: [minor, patch]