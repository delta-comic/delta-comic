name: 构建和发布

on:
  push:
    branches:
      - 'main'
      - 'next'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  packages: write
  pull-requests: write

concurrency:
  group: release/${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref_name == 'main' || github.ref_name == 'next'
    runs-on: ubuntu-latest
    outputs:
      has-release: ${{ steps.release-plan.outputs.has-release }}
      version: ${{ steps.release-plan.outputs.version }}
      channel: ${{ steps.release-plan.outputs.channel }}
      recovery-required: ${{ steps.release-plan.outputs.recovery-required }}
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          node-manager: true
          run-install: true
          version-file: package.json

      - run: vp run --filter @delta-comic/release-cli build
      - run: vp run build:packages

      - name: Resolve semantic release plan
        id: release-plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp exec dr release plan

      - name: No release required
        if:
          steps.release-plan.outputs.has-release != 'true' &&
          steps.release-plan.outputs.recovery-required != 'true'
        run: echo 'No releasable Conventional Commit was found.'

      - name: Recovery required
        if: steps.release-plan.outputs.recovery-required == 'true'
        run: echo 'Run this workflow manually with recover_withdrawn_2x enabled.'

  android:
    needs: plan
    if: needs.plan.outputs.has-release == 'true'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      DELTA_SKIP_LIB_BUILD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          node-manager: true
          run-install: true
          version-file: package.json

      - name: Synchronize build version
        run: |
          vpr release-cli
          vp exec dr version "${{ needs.plan.outputs.version }}"

      - name: Build release workspace libraries
        run: vp run build:packages

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-12
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r29
          link-to-sdk: true
          local-cache: true
          add-to-path: true

      - name: Initialize Android project
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          cd packages/app/mobile
          vp run --filter @delta-comic/mobile --fail-if-no-match tauri android init --ci --skip-targets-install
          git restore src-tauri/gen/android/buildSrc/src/main/java/org/wenxig/delta_comic/kotlin/BuildTask.kt

          chmod +x ./src-tauri/gen/android/gradlew

      - name: Build Android App
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cd packages/app/mobile
          vp run --filter @delta-comic/mobile --fail-if-no-match tauri android build --ci --target aarch64 armv7

      - name: Sign Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/keystore.p12"
          APK="./packages/app/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          OUTPUT="./dist/release/delta-comic-$RELEASE_VERSION-android.apk"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          sudo apt-get update
          sudo apt-get install -y apksigner

          mkdir -p dist/release

          apksigner sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASS" \
            --key-pass "env:KEYSTORE_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$OUTPUT" \
            "$APK"

          apksigner verify "$OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            dist/release/*.apk
            dist/release/*.apk.idsig
          if-no-files-found: error

  desktop:
    needs: plan
    if: needs.plan.outputs.has-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-latest
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    env:
      HUSKY: 0
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      DELTA_SKIP_LIB_BUILD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          node-manager: true
          run-install: true
          version-file: package.json

      - name: Synchronize build version
        run: |
          vpr release-cli
          vp exec dr version "${{ needs.plan.outputs.version }}" -p "${{matrix.platform}}"

      - name: Build release workspace libraries
        run: vp run build:packages

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-12
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: ${{ matrix.args }}
          projectPath: packages/app/desktop
          retryAttempts: 0
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: release-desktop-[platform]-[arch]-[bundle]

  release:
    needs: [plan, android, desktop]
    if: needs.plan.outputs.has-release == 'true'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          node-manager: true
          run-install: true
          version-file: package.json

      - run: vpr release-cli

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Configure auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'delta-comic-bot'
          git config user.email 'delta-comic-bot@proton.me'
          vp pm config set '//npm.pkg.github.com/:_authToken' "$GITHUB_TOKEN"

      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: vp exec dr release run