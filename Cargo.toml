[workspace]
resolver = "3"
members = [
  "packages/app/src-tauri",
  "crates/db",
  "crates/downloader",
  "crates/http",
  "crates/downloader/tools/performance-baseline",
  "crates/logger",
  "crates/plugin",
  "crates/utils",
]

[workspace.package]
authors = ["wenxig"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/delta-comic/delta-comic"
rust-version = "1.100.0"
version = "3.0.0-next.32"

[workspace.dependencies]
android-native-keyring-store = { git = "https://github.com/open-source-cooperative/android-native-keyring-store", rev = "5b675c57e161aad1b9705e11b9f11c64bf9653e6" }
apple-native-keyring-store = { version = "1.0.3", features = ["keychain"] }
axum = "0.8.9"
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
cookie_store = { version = "0.22.1", features = ["serde"] }
data-url = "0.3.2"
dashmap = "6.2.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
httpdate = "1.0.3"
jni = "0.22.4"
jni-keyring = { package = "jni", version = "0.21.1" }
keyring-core = "1.1.0"
libc = "0.2.191"
log = "0.4.35"
mach2 = "0.7.0"
md-5 = "0.11.0"
mime_guess = "2.0.5"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSUserDefaults"] }
percent-encoding = "2.3.2"
rand = "0.10.4"
rangemap = "1.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri = "2.12.7"
tauri-build = "2.7.6"
tauri-plugin = "2.7.4"
tauri-plugin-aptabase = { git = "https://github.com/delta-comic/tauri-plugin-aptabase-rustls", branch = "main" }
tauri-plugin-http = { path = "crates/http", features = ["multipart", "blocking"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-db = { path = "crates/db" }
tauri-plugin-downloader = { path = "crates/downloader" }
tauri-plugin-logger = { path = "crates/logger" }
tauri-plugin-fs = "2.7.1"
tauri-plugin-m3 = "0.3.2"
tauri-plugin-persisted-scope = "2.4.3"
tauri-plugin-plugin = { path = "crates/plugin" }
tauri-plugin-shell = "2.6.0"
tauri-plugin-webview-upgrade = { git = "https://github.com/readest/tauri-plugin-webview-upgrade" }

tauri-plugin-sql = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", features = [
  "sqlite",
] }
tauri-plugin-utils = { path = "crates/utils" }
taurpc = "0.8.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
zeroize = "1.9.2"
zip = { version = "9.9.0", default-features = false, features = ["deflate-flate2"] }

[profile.dev]
debug = "line-tables-only"
overflow-checks = true
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
debug = false
incremental = false